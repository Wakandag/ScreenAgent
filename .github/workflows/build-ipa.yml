name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build llama.cpp static libs
        run: bash Scripts/build-llama.sh

      - name: Download bundled model
        run: bash Scripts/fetch-model.sh

      # No Assets.car is shipped on purpose: the actool-compiled catalog made
      # LaunchServices fail to build the icon cache (TrollStore error 181).
      # The loose AppIcon*.png files declared in CFBundleIconFiles are generated
      # in the packaging step below.

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned .app
        run: |
          xcodebuild -project ScreenAgent.xcodeproj \
            -scheme ScreenAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP="build/dd/Build/Products/Release-iphoneos/ScreenAgent.app"
          SRC="AppIcon.xcassets/AppIcon.appiconset/icon1024.png"
          # A Resources/ folder inside the .app makes LaunchServices treat the
          # bundle as an old macOS-style (non-flat) bundle and refuse it with
          # 181 "Failed to add app to icon cache". Keep the model at the root;
          # LLM.swift looks for it there first.
          if [ -f "$APP/Resources/model.gguf" ]; then
            mv "$APP/Resources/model.gguf" "$APP/model.gguf"
          fi
          rm -rf "$APP/Resources"
          test -f "$APP/model.gguf" || { echo "model.gguf missing from bundle root"; exit 1; }
          test ! -d "$APP/Resources" || { echo "Resources folder must not ship"; exit 1; }
          # installd resolves every name in CFBundleIconFiles to loose PNGs in
          # the bundle; if one is missing the registration step fails with 181.
          for spec in 20x20@2x:40 20x20@3x:60 29x29@2x:58 29x29@3x:87 \
                      40x40@2x:80 40x40@3x:120 60x60@2x:120 60x60@3x:180 \
                      76x76@2x~ipad:152 83.5x83.5@2x~ipad:167; do
            name="${spec%%:*}"
            px="${spec##*:}"
            sips -s format png -z "$px" "$px" "$SRC" --out "$APP/AppIcon${name}.png" >/dev/null
          done
          sips -s format png -z 512 512 "$SRC" --out "$APP/iTunesArtwork" >/dev/null
          sips -s format png -z 1024 1024 "$SRC" --out "$APP/iTunesArtwork@2x" >/dev/null
          ls -la "$APP" | grep -E 'AppIcon|iTunesArtwork'
          # fail the build instead of uploading an IPA that cannot install
          for icon in AppIcon60x60@2x AppIcon60x60@3x AppIcon40x40@2x \
                      AppIcon29x29@2x AppIcon76x76@2x~ipad; do
            test -f "$APP/$icon.png" || { echo "missing $icon.png"; exit 1; }
          done
          grep -q CFBundleIconFiles "$APP/Info.plist" \
            || { echo "Info.plist has no CFBundleIconFiles"; exit 1; }
          mkdir Payload
          cp -r "$APP" Payload/
          zip -qr ScreenAgent.ipa Payload
          ls -la ScreenAgent.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenAgent-ipa
          path: ScreenAgent.ipa
